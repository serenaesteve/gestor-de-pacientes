# Volante en gestorpacientes.serenaesteve.com: Apache pone el HTTPS y reenvía a 127.0.0.1:8103.
<VirtualHost *:80>
    ServerName gestorpacientes.serenaesteve.com

    # La verificación de Let's Encrypt se sirve aquí; todo lo demás va a HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://gestorpacientes.serenaesteve.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/volante-error.log
    CustomLog ${APACHE_LOG_DIR}/volante-access.log combined
</VirtualHost>
