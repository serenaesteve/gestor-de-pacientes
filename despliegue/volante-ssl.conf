<VirtualHost *:443>
    ServerName gestorpacientes.serenaesteve.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gestorpacientes.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gestorpacientes.serenaesteve.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    # La aplicación toma la IP real de X-Forwarded-For (la añade mod_proxy)
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8103/
    ProxyPassReverse / http://127.0.0.1:8103/
    ProxyTimeout 60
    LimitRequestBody 524288

    # Los enlaces de los pacientes llevan su firma en la ruta: no se guardan en el registro de Apache.
    SetEnvIf Request_URI "^/(api/)?[cov]/" enlace_paciente
    CustomLog ${APACHE_LOG_DIR}/volante-ssl-access.log combined env=!enlace_paciente
    ErrorLog ${APACHE_LOG_DIR}/volante-ssl-error.log
</VirtualHost>
